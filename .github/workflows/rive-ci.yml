name: Rive CI

on:
  push:
    branches: [main]
    paths:
      - 'rive/**'
      - '.github/workflows/rive-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'rive/**'
      - '.github/workflows/rive-ci.yml'

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck on rive
        run: |
          shellcheck --severity=warning rive/bin/rive rive/lib/*.sh rive/test/lifecycle_test.sh
          echo "ShellCheck passed!"

  test:
    name: BATS Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install BATS
        run: |
          sudo apt-get install -y bats

      - name: Run BATS tests
        run: |
          cd rive
          bats test/rive.bats

  test-macos:
    name: BATS Tests (macOS)
    runs-on: macos-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install BATS
        run: brew install bats-core

      - name: Run BATS tests
        run: |
          cd rive
          bats test/rive.bats

  lifecycle:
    name: Lifecycle Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "Rive CI"

      - name: Run lifecycle tests
        run: |
          cd rive
          ./test/lifecycle_test.sh

  lifecycle-macos:
    name: Lifecycle Tests (macOS)
    runs-on: macos-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # macOS ships bash 3.2; rive's branch picker needs bash 4+, and the
      # suite skips those tests without it
      - name: Install bash
        run: brew install bash

      - name: Configure git identity
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "Rive CI"

      - name: Run lifecycle tests
        run: |
          cd rive
          /opt/homebrew/bin/bash ./test/lifecycle_test.sh
