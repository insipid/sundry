<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>schedule-ish</title>
  <!-- Favicon: a tilted napkin with a vague week of blocks, inline so there's no extra file. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg transform='rotate(-6 16 16)'%3E%3Crect x='2.5' y='2.5' width='27' height='27' rx='6' fill='%23fbfaf7' stroke='%233b3833' stroke-width='2'/%3E%3Cpath d='M3.5 9.5h25' stroke='%233b3833' stroke-width='1.6'/%3E%3Crect x='6.5' y='12' width='5.5' height='7' rx='2' fill='%237fa3d1'/%3E%3Crect x='13.25' y='14.5' width='5.5' height='10.5' rx='2' fill='%237dbb92'/%3E%3Crect x='20' y='12' width='5.5' height='5' rx='2' fill='%23eaa77a'/%3E%3Crect x='20' y='19' width='5.5' height='6' rx='2' fill='%237fa3d1'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root {
      --paper: #fbfaf7;
      --board: #ffffff;
      --ink: #3b3833;
      --muted: #948c80;
      --faint: #c9c1b4;
      --grid: #f1ede6;
      --zone-line: #e2dbcf;
      --band: #faf7f1;
      --accent: #7a6f5f;
      --gutter: 92px;
    }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--paper); color: var(--ink);
      font-family: 'Figtree', ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { cursor: pointer; }
    body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; }
    body.resizing, body.resizing * { cursor: ns-resize !important; user-select: none; }
    body.creating, body.creating * { cursor: crosshair !important; user-select: none; }
    body.copying, body.copying * { cursor: copy !important; user-select: none; }

    /* grid */
    .day-col { background-color: var(--board); border-left: 1px solid var(--grid); touch-action: none; }
    .day-col:first-of-type { border-left: 0; }
    .zone-line { position: absolute; left: 0; right: 0; height: 0; border-top: 1px solid var(--zone-line); pointer-events: none; }
    .step-line { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed var(--grid); pointer-events: none; }
    .band { position: absolute; left: 0; right: 0; background: var(--band); pointer-events: none; }
    .pin-left { position: sticky; left: 0; z-index: 25; background: var(--board); }
    /* While a regular or unplaced item is being dragged, day names are drop targets. */
    body.carrying .day-head { background: #f8f4ed; outline: 1.5px dashed var(--faint); outline-offset: -4px; }
    body.carrying .day-head.drop-hot { background: #eee6d8; outline-color: var(--accent); color: var(--ink); }
    .day-head.drop-hot::after { content: ' → ' attr(data-hint); font-size: 11px; font-weight: 500; color: var(--muted); }

    /* blocks */
    .block {
      position: absolute; box-sizing: border-box; border-radius: 12px;
      padding: 6px 9px; overflow: hidden; touch-action: none; cursor: grab;
      border: 1px solid transparent;
      box-shadow: 0 1px 0 rgba(60,50,30,.04);
      transition: box-shadow .12s ease, transform .12s ease, opacity .12s ease;
    }
    .block:hover { box-shadow: 0 2px 8px rgba(60,50,30,.10); }
    .block.selected { box-shadow: 0 0 0 2px var(--ring), 0 3px 10px rgba(60,50,30,.12); }
    .block.lifted { box-shadow: 0 8px 22px rgba(60,50,30,.18); transform: scale(1.015); z-index: 20; }
    .block.to-unplaced { opacity: .45; }
    .block.ghost { border: 1.5px dashed var(--ring); opacity: .75; pointer-events: none; }
    .block .title { font-weight: 600; font-size: 13px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .block .size-word { font-size: 11px; opacity: .7; margin-top: 2px; }
    .block .edge { position: absolute; left: 0; right: 0; height: 7px; cursor: ns-resize; z-index: 2; }
    .block .edge.top { top: 0; } .block .edge.bottom { bottom: 0; }
    .block .tools { position: absolute; top: 4px; right: 4px; display: none; gap: 2px; z-index: 3; }
    .block .tools.at-bottom { top: auto; bottom: 5px; }
    .block:hover .tools, .block.selected .tools { display: flex; }
    .block.lifted .tools, .block.editing .tools { display: none !important; }
    .tool { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center;
      font-size: 12px; line-height: 1; background: rgba(255,255,255,.7); color: var(--ink); border: 0; }
    .tool:hover { background: #fff; }
    .block input { width: 100%; font: inherit; font-weight: 600; font-size: 13px; background: rgba(255,255,255,.7);
      border: 0; border-radius: 6px; padding: 2px 5px; outline: none; color: var(--ink); }

    .block .has-notes { position: absolute; right: 8px; bottom: 2px; font-size: 16px; line-height: 1; opacity: .65; pointer-events: none; }
    .block:hover .has-notes, .block.selected .has-notes { display: none; } /* the tools take that corner */

    /* notes dialog + outliner */
    .dialog-overlay { position: fixed; inset: 0; z-index: 80; background: rgba(40,34,26,.18);
      display: grid; place-items: start center; padding-top: 12vh; }
    .dialog { width: min(440px, calc(100vw - 32px)); background: #fff; border-radius: 16px; overflow: hidden;
      box-shadow: 0 20px 50px rgba(60,50,30,.25), 0 0 0 1px rgba(60,50,30,.06); }
    .dialog-head { padding: 14px 16px 10px; }
    input.dialog-title:hover { background: rgba(255,255,255,.45); }
    input.dialog-title:focus { background: rgba(255,255,255,.7); }
    .dialog-title { border-radius: 6px; margin-left: -4px; padding-left: 4px !important; }
    .dialog-title { width: 100%; font: inherit; font-size: 17px; font-weight: 700; color: inherit; background: transparent;
      border: 0; outline: none; padding: 0; }
    .dialog-body { padding: 10px 12px 8px; max-height: 50vh; overflow-y: auto; }
    .dialog-sec { padding: 4px 0 6px; }
    .dialog-sec h3 { margin: 4px 4px 6px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .holder-btn { flex: none; margin-top: 3px; border: 0; background: rgba(255,255,255,.6); color: inherit; font: inherit; font-size: 11.5px;
      padding: 2px 9px; border-radius: 99px; opacity: .85; white-space: nowrap; }
    .holder-btn:hover { background: #fff; opacity: 1; }
    .fitem { display: flex; align-items: center; gap: 6px; border-radius: 8px; }
    .fitem.dragging { opacity: .4; }
    .fitem.over { box-shadow: 0 -2px 0 var(--accent); }
    .grip { width: 14px; flex: none; color: var(--faint); cursor: grab; font-size: 12px; text-align: center; user-select: none; }
    .ftick { width: 18px; height: 18px; flex: none; border-radius: 99px; border: 1.5px solid var(--faint); background: #fff; padding: 0;
      font-size: 11px; line-height: 1; color: #fff; }
    .ftick:hover { border-color: var(--muted); }
    .ftick.on { background: #9fb6a3; border-color: #9fb6a3; }
    .ftext { flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 14px; padding: 5px 2px; color: var(--ink); background: transparent; }
    .next-pill { flex: none; font-size: 10.5px; font-weight: 600; padding: 1px 7px; border-radius: 99px; background: #f6e9c8; color: #8a6d24; }
    .fhint, .fsoft { font-size: 12px; padding: 4px 0 2px 20px; line-height: 1.5; }
    .fhint { color: var(--muted); }
    .fsoft { color: #9a7a2c; }
    .done-toggle { border: 0; background: none; font: inherit; font-size: 12px; color: var(--muted); padding: 6px 0 2px 4px; }
    .done-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--faint); padding: 3px 0 3px 20px; }
    .done-item span { text-decoration: line-through; }
    .session-line { width: 100%; border: 0; border-bottom: 1px dashed var(--zone-line); outline: none; font: inherit; font-size: 13.5px;
      padding: 6px 4px; color: var(--ink); background: transparent; }
    .session-box { width: 100%; border: 1px solid #e4ded3; border-radius: 10px; outline: none; font: inherit; font-size: 14px; padding: 8px 10px;
      color: var(--ink); resize: vertical; }
    .session-box:focus { border-color: var(--faint); }
    .ro { font-weight: 400; text-transform: none; letter-spacing: 0; }
    .ro-item { font-size: 14px; color: var(--ink); padding: 3px 4px; }
    .ro-item.done { color: var(--faint); text-decoration: line-through; }
    div.dialog-title { font-size: 17px; font-weight: 700; }
    .block .next-line { font-size: 11.5px; margin-top: 2px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* sidebar chips */
    .chip { border-radius: 10px; padding: 7px 10px; font-size: 13px; font-weight: 500; cursor: grab;
      display: flex; align-items: center; gap: 8px; touch-action: none; border: 1px solid transparent; }
    .chip:hover { box-shadow: 0 2px 8px rgba(60,50,30,.10); }
    .pips { display: inline-flex; gap: 2px; margin-left: auto; }
    .pips i { width: 5px; height: 5px; border-radius: 99px; background: currentColor; opacity: .75; }
    .pips i.off { opacity: .18; }
    .floating { position: fixed; pointer-events: none; z-index: 60; transform: translate(-50%, -50%) rotate(-2deg);
      box-shadow: 0 10px 24px rgba(60,50,30,.2); }
    .reorder-line { position: absolute; left: 4px; right: 4px; height: 2px; border-radius: 2px; background: var(--accent); pointer-events: none; }
    #unplaced-drop.drop-hot { background: #f3eee5; outline: 1.5px dashed var(--faint); }

    /* zone labels (drag to move a break) and the early/evening toggles */
    .zone-label { position: absolute; left: 0; right: 0; display: flex; justify-content: flex-end; align-items: center;
      gap: 4px; padding: 6px 8px 6px 0; font-size: 11.5px; font-weight: 500; color: var(--muted);
      user-select: none; touch-action: none; }
    .zone-label span { padding: 1px 5px; border-radius: 6px; transition: background .12s, color .12s; }
    .zone-label.optional { cursor: pointer; }
    .zone-label.movable { cursor: ns-resize; }
    .zone-label[data-zone-label]:hover span, .zone-label.active span { background: #f1ece3; color: var(--ink); }
    .zone-label span { position: relative; }
    .zone-minus { position: absolute; right: 100%; margin-right: 3px; font-style: normal; opacity: 0; transition: opacity .12s; }
    .zone-label:hover .zone-minus { opacity: .8; }
    .zone-add { font-size: 11.5px; color: var(--faint); padding: 1px 7px; border-radius: 6px; border: 0; background: transparent; }
    .zone-add:hover { color: var(--ink); background: #f1ece3; }

    /* popover + toast */
    .popover { position: fixed; z-index: 50; background: #fff; border-radius: 14px; padding: 14px;
      box-shadow: 0 12px 36px rgba(60,50,30,.18), 0 0 0 1px rgba(60,50,30,.06); width: 272px; }
    .popover label { display: block; font-size: 11px; font-weight: 600; color: var(--muted);
      text-transform: lowercase; letter-spacing: .03em; margin: 10px 0 5px; }
    .popover label:first-child { margin-top: 0; }
    .seg { display: flex; flex-wrap: wrap; gap: 4px; }
    .seg button { font-size: 12px; padding: 4px 8px; border-radius: 8px; background: #f3efe8; border: 0; color: var(--ink); }
    .seg button.on { background: var(--ink); color: #fff; }
    .swatch { width: 22px; height: 22px; border-radius: 99px; border: 2px solid transparent; }
    .swatch.on { border-color: var(--ink); }
    .field { width: 100%; box-sizing: border-box; font: inherit; font-size: 14px; padding: 6px 9px; border-radius: 8px;
      border: 1px solid #e4ded3; outline: none; background: #fff; color: var(--ink); }
    .field:focus { border-color: var(--faint); }
    .btn { font-size: 13px; font-weight: 500; padding: 6px 11px; border-radius: 9px; border: 0; background: #f3efe8; color: var(--ink); }
    .btn:hover { background: #ebe5da; }
    .btn.on { background: #e6dfd2; }
    .week-btn { font: inherit; font-size: 15px; font-weight: 600; color: var(--ink); background: #f3efe8; border: 0;
      border-radius: 9px; padding: 3px 10px; display: inline-flex; gap: 6px; align-items: baseline; white-space: nowrap; }
    .week-btn:hover { background: #ebe5da; }
    .week-btn .caret { font-size: 11px; color: var(--muted); }
    .menu-item { display: block; width: 100%; text-align: left; font-size: 13.5px; padding: 6px 8px; border-radius: 8px;
      border: 0; background: transparent; color: var(--ink); }
    .menu-item:hover:not([disabled]) { background: #f3efe8; }
    .menu-item.on { font-weight: 600; }
    .menu-item.danger { color: #a65a5a; }
    .menu-item[disabled] { opacity: .4; cursor: default; }
    /* plan / review */
    .mode-seg { display: inline-flex; background: #f1ece3; border-radius: 10px; padding: 3px; align-self: center; }
    .mode-seg button { border: 0; background: transparent; font: inherit; font-size: 13px; padding: 3px 12px; border-radius: 8px; color: var(--muted); }
    .mode-seg button.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(60,50,30,.12); }
    .today-dot { display: inline-block; width: 6px; height: 6px; border-radius: 9px; background: #b0703f; margin-left: 5px; vertical-align: middle; }
    body.reviewing .block { cursor: grab; }
    /* review: unplanned blocks are hatched; ghosts mark where moved blocks were planned */
    .block.unplanned { background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.55) 0 5px, transparent 5px 11px); border: 1.5px dashed var(--ring); }
    .block.faint-unplanned { opacity: .32; pointer-events: none; z-index: 0; }
    /* The ghost takes pointer events only for hover; a press on it still draws in the column. */
    .plan-ghost { position: absolute; left: 3px; right: 3px; border: 1.5px dashed var(--ring); border-radius: 12px; opacity: .4; }
    .plan-ghost.lit, .plan-ghost.hot { opacity: .7; background: color-mix(in srgb, var(--ring) 6%, transparent); }
    .block.ghost-hot { outline: 2px solid color-mix(in srgb, var(--ring) 50%, transparent); outline-offset: 2px; }
    body.reviewing .block .title { padding-right: 30px; }
    body.reviewing .block.unrated { opacity: .62; }
    body.reviewing .block.r-1 { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ring) 45%, transparent); }
    body.reviewing .block.r-2 { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--ring) 45%, transparent); }
    body.reviewing .block.r-3 { box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--ring) 45%, transparent); }
    body.reviewing .block.r-skip { background: transparent !important; border: 1.5px dashed var(--faint); color: var(--muted) !important; }
    body.reviewing .block.r-skip .title { text-decoration: line-through; }
    /* "didn't happen" is long: it sits in the bottom corner so the struck-through name stays readable */
    body.reviewing .block.r-skip .rate { top: auto; bottom: 4px; font-size: 11px; }
    body.reviewing .block.r-bad { border: 1.5px dashed #b85c5c; }
    body.reviewing .block.selected { outline: 2px solid var(--ring); outline-offset: 1px; }
    .block .rate { position: absolute; top: 4px; right: 5px; min-width: 24px; height: 20px; padding: 0 5px; border-radius: 7px; border: 0;
      background: rgba(255,255,255,.72); font: inherit; font-size: 12px; font-weight: 700; color: inherit; letter-spacing: -1px; z-index: 3; }
    .block .rate:hover { background: #fff; }
    .block .rate.word, .block .rate.empty { letter-spacing: 0; font-weight: 500; }
    .block .rate.empty { color: var(--muted); }
    /* an unused ✓? only shows on hover (or when selected); touch screens always show it */
    @media (hover: hover) {
      .block .rate.empty { opacity: 0; transition: opacity .12s; }
      .block:hover .rate.empty, .block.selected .rate.empty, .block .rate.empty:focus-visible { opacity: 1; }
    }
    .block .tag-line { font-size: 11px; opacity: .8; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dayline { width: 100%; min-width: 0; border: 0; border-top: 1px dashed var(--zone-line); border-left: 1px solid var(--grid); padding: 0 8px;
      font: inherit; font-size: 12px; background: #fdfcf9; color: var(--ink); outline: none; }
    .dayline:focus { background: #fff; }
    #review-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--grid); min-height: 48px; }
    .review-hint { font-size: 12.5px; color: var(--muted); margin-right: 4px; }
    .review-hint b { color: var(--ink); font-weight: 600; }
    .review-hint kbd { font: inherit; font-size: 11px; background: #f1ece3; border-radius: 5px; padding: 0 5px; }
    .tag-chip { font: inherit; font-size: 12.5px; padding: 3px 11px; border-radius: 99px; border: 1px solid #e4ded3; background: #fff; color: var(--muted); }
    .tag-chip:hover { color: var(--ink); }
    .tag-chip.on { background: #dbe7f5; border-color: #9fb6d6; color: #3f5f8a; }
    .tag-chip.add { border-style: dashed; }
    .tag-chip input { border: 0; outline: none; font: inherit; width: 90px; background: transparent; color: var(--ink); }
    .menu-sep { height: 1px; background: var(--grid); margin: 6px 0; }
    .btn.primary { background: var(--ink); color: #fff; }
    .btn.danger { color: #a65a5a; background: transparent; }
    .btn.danger:hover { background: #f8e9e9; }
    #toast { position: fixed; bottom: 22px; left: 50%; transform: translate(-50%, 20px); opacity: 0;
      background: var(--ink); color: #fff; font-size: 13px; padding: 8px 14px; border-radius: 10px;
      transition: all .2s ease; pointer-events: none; z-index: 70; }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* print / Save as PDF: just the week, landscape, colours kept */
    @media print {
      @page { size: landscape; margin: 10mm; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      html, body, .h-full { height: auto !important; background: #fff; }
      header { padding: 0 0 8px !important; }
      .week-btn { background: none; padding: 0; }
      .week-btn .caret { display: none; }
      header .ml-auto, #sidebar, #toast, .popover, .zone-add-row, .zone-minus, .mode-seg, #review-bar,
      .block .tools, .block .edge { display: none !important; }
      main { display: block !important; padding: 0 !important; }
      main > section { box-shadow: none !important; border: 1px solid #e6e1d8; }
      #board-body { overflow: visible !important; }
      .block, .block.selected, .block:hover { box-shadow: none !important; }
      .zone-label span { background: none !important; }
      .block .has-notes { display: block !important; }
      #print-notes:not(:empty) { display: block; break-before: page; }
    }
    #print-notes { display: none; font-size: 13px; }
    #print-notes h2 { font-size: 18px; font-weight: 700; margin: 0 0 14px; }
    #print-notes h3 { font-size: 14px; font-weight: 600; margin: 14px 0 4px; break-after: avoid; }
    #print-notes ul { list-style: none; margin: 0; padding: 0 0 0 2px; }
    #print-notes li { margin: 2px 0; }
    #print-notes li.done { color: #8a8378; text-decoration: line-through; }
    #print-notes .pdays { font-weight: 400; font-size: 12px; color: #8a8378; margin-left: 6px; }
    #print-notes .psess { margin: 4px 0 0 2px; }
  </style>
</head>
<body>
  <div class="h-full flex flex-col">
    <header class="flex items-center gap-4 px-5 pt-4 pb-3">
      <div class="flex items-baseline gap-3">
        <h1 class="text-xl font-bold tracking-tight whitespace-nowrap">schedule-ish</h1>
        <button class="week-btn" data-cmd="weeks" title="Switch week, or start a new one"><span id="week-name"></span><span class="caret">▾</span></button>
        <div class="mode-seg" role="group" aria-label="Mode">
          <button data-cmd="mode" data-mode="plan" title="Plan: arrange the week">Plan</button>
          <button data-cmd="mode" data-mode="review" title="Review: rate and tag how it went (the plan is locked)">Review</button>
        </div>
        <span class="text-sm whitespace-nowrap max-lg:hidden" style="color: var(--muted)">back-of-a-napkin planning</span>
      </div>
      <div class="ml-auto flex items-center gap-1.5">
        <button class="btn !px-2.5" data-cmd="toggle-sidebar" title="Show / hide the sidebar" aria-label="Toggle sidebar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
        <button class="btn !px-2.5" data-cmd="undo" title="Undo (⌘Z)" aria-label="Undo"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
        <button class="btn !px-2.5" data-cmd="redo" title="Redo (⇧⌘Z)" aria-label="Redo"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="m15 14 5-5-5-5M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
        <button class="btn" data-cmd="print" title="Print the week, or choose “Save as PDF” in the print dialog">Print</button>
        <button class="btn !px-2.5" data-cmd="more" title="Export, import, clear" aria-label="More">⋯</button>
        <button class="btn" data-cmd="settings" title="Days, zones, clearing">Settings</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
      </div>
    </header>

    <main id="main" class="flex-1 min-h-0 flex gap-3 pb-5">
      <aside id="sidebar" class="w-64 shrink-0 flex flex-col gap-5 overflow-y-auto overflow-x-hidden px-2"></aside>
      <section class="flex-1 min-w-0 flex flex-col rounded-2xl overflow-hidden"
